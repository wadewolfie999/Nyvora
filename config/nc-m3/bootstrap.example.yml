api_version: nodecontrol.io/v1alpha1
kind: NC-M3Bootstrap
metadata:
  name: primary
spec:
  placement_profile: mac-authority
  # Public DNS/TLS/ingress are NC-M3E inputs and are intentionally absent here.
  operator: vahid
  age_recipients:
    - age1replacewithpublicrecipientonly
  preconditions:
    mac_authority_and_recovery_procedure_approved: true
    authenticated_private_three_node_control_path_designed: true
    asus_postgres_and_nats_placement_approved: true
    vps_private_topology_membership_designed: true
    wildcard_dns_control: false
    public_tls_and_ingress_control: false
    authentik_human_identity_bootstrap: false
  records:
    authority_placement_evidence: docs/nyvora-roadmap-reconciliation-v2.md
    private_topology_evidence: pending
    dns_evidence: deferred-to-nc-m3e
    recovery_evidence: pending
    capacity_evidence: pending
    privilege_evidence: pending
    port_ownership_evidence: pending
    caddy_preservation_evidence: pending
    secret_custody_evidence: pending
    nats_evidence: pending

# This is the NC-M3A authority/placement example and is intentionally not
# consumable by the preserved legacy NC-M3 renderer. Copy it to bootstrap.yml
# only after replacing non-secret inputs and recording every applicable
# prerequisite for the decomposed milestone.
# Never add private age identities, passwords, NATS credentials, or tokens.
