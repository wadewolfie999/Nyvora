name: Repository backup

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 0"

permissions:
  contents: read
  actions: write

jobs:
  git-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create and verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --tags origin
          git bundle create nyvora.git.bundle --all
          git bundle verify nyvora.git.bundle
          git clone --mirror nyvora.git.bundle restored.git
          git -C restored.git fsck --full
          test "$(git -C restored.git rev-parse HEAD)" = "$(git rev-parse HEAD)"
          sha256sum nyvora.git.bundle > nyvora.git.bundle.sha256
          git rev-parse HEAD > nyvora.main.commit

      - name: Upload recoverable repository backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nyvora-git-bundle-${{ github.run_id }}
          path: |
            nyvora.git.bundle
            nyvora.git.bundle.sha256
            nyvora.main.commit
          if-no-files-found: error
          retention-days: 90
