name: Repository backup

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 0"

permissions:
  contents: read
  actions: write

jobs:
  git-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create and verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --tags origin
          git bundle create nyvora.git.bundle --all
          git bundle verify nyvora.git.bundle
          sha256sum nyvora.git.bundle > nyvora.git.bundle.sha256
          git rev-parse HEAD > nyvora.main.commit

      - name: Upload recoverable repository backup
        uses: actions/upload-artifact@v4
        with:
          name: nyvora-git-bundle-${{ github.run_id }}
          path: |
            nyvora.git.bundle
            nyvora.git.bundle.sha256
            nyvora.main.commit
          if-no-files-found: error
          retention-days: 90
