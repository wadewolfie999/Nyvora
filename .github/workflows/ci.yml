name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruby-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.1'
      - name: Validate preserved legacy contracts (not baseline compliance)
        run: ruby scripts/validate_repo.rb
      - name: Validate adopted architecture baseline
        run: ruby scripts/validate_architecture_baseline.rb
      - name: Run Ruby contract tests
        run: |
          ruby scripts/test_nc_m3_config.rb
          ruby scripts/test_collect_nc_m3_preflight.rb
      - name: Check patch whitespace
        run: git diff --check

  go-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Run Go tests
        run: go test ./...
