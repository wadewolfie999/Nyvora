name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruby-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: '3.1'
      - name: Validate preserved legacy contracts (not baseline compliance)
        run: ruby scripts/validate_repo.rb
      - name: Validate adopted architecture baseline
        run: ruby scripts/validate_architecture_baseline.rb
      - name: Run Ruby contract tests
        run: |
          ruby scripts/test_nc_m3_config.rb
          ruby scripts/test_collect_nc_m3_preflight.rb
      - name: Check patch whitespace
        run: git diff --check

  go-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run Go tests
        run: go test ./...
